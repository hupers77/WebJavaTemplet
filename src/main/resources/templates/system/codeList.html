<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/default :: layout('공통코드관리', ~{::section})}">
<body>
<section>
    <h2>공통코드관리</h2>
    <div class="cols">
        <div>
            <h3>그룹</h3>
            <ul class="list">
                <li th:each="g : ${groups}">
                    <a th:href="@{/system/code(grpCd=${g.GRP_CD})}"
                       th:text="${g.GRP_CD} + ' (' + ${g.CNT} + ')'"
                       th:classappend="${g.GRP_CD == selGrpCd ? ' active' : ''}">ROLE (2)</a>
                </li>
            </ul>
        </div>
        <div>
            <h3 th:text="'상세 : ' + ${selGrpCd}">상세</h3>
            <table class="tbl" th:if="${codes != null}">
                <thead><tr><th>상세코드</th><th>코드명</th><th>순서</th><th>사용</th></tr></thead>
                <tbody>
                <tr th:each="c : ${codes}">
                    <td th:text="${c.DTL_CD}">ADMIN</td>
                    <td th:text="${c.DTL_NM}">관리자</td>
                    <td th:text="${c.SORT_NO}">1</td>
                    <td th:text="${c.USE_YN}">Y</td>
                </tr>
                </tbody>
            </table>
            <form class="form inline-form" method="post" th:action="@{/system/code/save}" th:if="${selGrpCd != null}">
                <input type="hidden" name="grpCd" th:value="${selGrpCd}"/>
                <input type="text" name="dtlCd" placeholder="상세코드" required/>
                <input type="text" name="dtlNm" placeholder="코드명" required/>
                <input type="number" name="sortNo" value="9"/>
                <select name="useYn"><option value="Y">Y</option><option value="N">N</option></select>
                <button class="btn primary" type="submit">저장</button>
            </form>
            <p class="muted" th:if="${selGrpCd == null}">좌측 그룹을 선택하세요.</p>
        </div>
    </div>
</section>
</body>
</html>
