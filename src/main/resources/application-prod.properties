# 운영 (외장 Tomcat WAR 배포용)
# Tomcat context.xml 또는 환경변수로 datasource를 덮어쓰는 것을 권장
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:mysql://db-prod:3306/intra?useSSL=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:intra}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5

spring.thymeleaf.cache=true
logging.level.com.company.intra=INFO
logging.level.org.springframework.security=WARN
