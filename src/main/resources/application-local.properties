# 로컬 개발용 (내장 Tomcat + 로컬 MySQL)
spring.profiles.active=local
server.port=8080

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/intra?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=intra
spring.datasource.password=intra1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.thymeleaf.cache=false
logging.level.com.company.intra=DEBUG
logging.level.org.springframework.security=DEBUG
